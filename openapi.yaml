    SuggestionCreateResult:
      type: object
      required: [generated_count, skipped_labeled_count]
      properties:
        generated_count:
          type: integer
          minimum: 0
        skipped_labeled_count:
          type: integer
          minimum: 0
    RefListRequest:
      type: object
      required: [refs]
      properties:
        refs:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Ref"
    ThresholdAcceptRequest:
      type: object
      required: [min_confidence]
      properties:
        min_confidence:
          type: number
          minimum: 0
          maximum: 1
