[project]
name = "faunalab"
version = "0.1.0"
description = "FaunaLab HTTP API and training worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pillow>=12.3.0",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["faunalab"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pip-licenses>=5.0",
    "pyright>=1.1",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=faunalab",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["faunalab"]

[tool.coverage.report]
skip_empty = true
# fail_under は意図して未設定。70 % の enforce は F018/F019。

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["faunalab", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
include = ["faunalab", "tests"]
